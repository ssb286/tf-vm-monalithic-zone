name: Azure Terraform Deployment

on:
  push:
    branches: [ "main", "feature_new-rg" ]
  workflow_dispatch: 

jobs:
  terraform:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        auth-type: 'USER_PASSWORD' # यूज़रनेम/पासवर्ड लॉगिन फ़ोर्स करने के लिए

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0"
        terraform_wrapper: false 

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan
